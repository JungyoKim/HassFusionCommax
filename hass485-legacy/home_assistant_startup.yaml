# HASS485 자동 시작을 위한 설정
# 이 내용을 configuration.yaml에 추가하세요

# 셸 명령어 정의
shell_command:
  start_hass485: "bash /config/scripts/startup_script.sh"

# 자동화 (최신 형식)
automation:
  - id: 'hass485_auto_start'
    alias: "HASS485 자동 시작"
    description: "Home Assistant 시작 시 HASS485 프로그램 자동 실행"
    trigger:
      - platform: homeassistant
        event: start
    condition: []
    action:
      - service: shell_command.start_hass485
    mode: single

# 시스템 모니터링 (선택사항)
sensor:
  - platform: command_line
    name: "HASS485 상태"
    command: "pgrep -f hass485-linux"
    scan_interval: 60
    value_template: "{{ '실행중' if value|int > 0 else '중지됨' }}" 