# Home Assistant MQTT 설정 예제
# 이 파일을 Home Assistant의 configuration.yaml에 추가하거나
# MQTT 통합구성요소에서 직접 설정할 수 있습니다

# 조명 (Light) 설정
light:
  - platform: mqtt
    name: "거실 조명 1"
    state_topic: "hass485/lights/1/state"
    command_topic: "hass485/lights/1/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

  - platform: mqtt
    name: "거실 조명 2"
    state_topic: "hass485/lights/2/state"
    command_topic: "hass485/lights/2/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

  - platform: mqtt
    name: "거실 조명 3"
    state_topic: "hass485/lights/3/state"
    command_topic: "hass485/lights/3/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

  - platform: mqtt
    name: "거실 조명 4"
    state_topic: "hass485/lights/4/state"
    command_topic: "hass485/lights/4/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

  - platform: mqtt
    name: "복도 조명"
    state_topic: "hass485/lights/5/state"
    command_topic: "hass485/lights/5/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

# 보일러 (Climate) 설정
climate:
  - platform: mqtt
    name: "거실 보일러"
    modes:
      - "off"
      - "heat"
      - "cool"
    mode_state_topic: "hass485/boilers/1/state"
    mode_command_topic: "hass485/boilers/1/command"
    mode_state_template: "{{ value_json.value.mode }}"
    mode_command_template: '{"type": "mode", "value": "{{ value }}"}'
    current_temperature_topic: "hass485/boilers/1/state"
    current_temperature_template: "{{ value_json.value.current_temp }}"
    temperature_state_topic: "hass485/boilers/1/state"
    temperature_command_topic: "hass485/boilers/1/command"
    temperature_state_template: "{{ value_json.value.set_temp }}"
    temperature_command_template: '{"type": "set_temp", "value": {{ value }}}'
    min_temp: 10
    max_temp: 30
    temp_step: 1

  - platform: mqtt
    name: "안방 보일러"
    modes:
      - "off"
      - "heat"
      - "cool"
    mode_state_topic: "hass485/boilers/2/state"
    mode_command_topic: "hass485/boilers/2/command"
    mode_state_template: "{{ value_json.value.mode }}"
    mode_command_template: '{"type": "mode", "value": "{{ value }}"}'
    current_temperature_topic: "hass485/boilers/2/state"
    current_temperature_template: "{{ value_json.value.current_temp }}"
    temperature_state_topic: "hass485/boilers/2/state"
    temperature_command_topic: "hass485/boilers/2/command"
    temperature_state_template: "{{ value_json.value.set_temp }}"
    temperature_command_template: '{"type": "set_temp", "value": {{ value }}}'
    min_temp: 10
    max_temp: 30
    temp_step: 1

  - platform: mqtt
    name: "공부방 보일러"
    modes:
      - "off"
      - "heat"
      - "cool"
    mode_state_topic: "hass485/boilers/3/state"
    mode_command_topic: "hass485/boilers/3/command"
    mode_state_template: "{{ value_json.value.mode }}"
    mode_command_template: '{"type": "mode", "value": "{{ value }}"}'
    current_temperature_topic: "hass485/boilers/3/state"
    current_temperature_template: "{{ value_json.value.current_temp }}"
    temperature_state_topic: "hass485/boilers/3/state"
    temperature_command_topic: "hass485/boilers/3/command"
    temperature_state_template: "{{ value_json.value.set_temp }}"
    temperature_command_template: '{"type": "set_temp", "value": {{ value }}}'
    min_temp: 10
    max_temp: 30
    temp_step: 1

  - platform: mqtt
    name: "침대방 보일러"
    modes:
      - "off"
      - "heat"
      - "cool"
    mode_state_topic: "hass485/boilers/4/state"
    mode_command_topic: "hass485/boilers/4/command"
    mode_state_template: "{{ value_json.value.mode }}"
    mode_command_template: '{"type": "mode", "value": "{{ value }}"}'
    current_temperature_topic: "hass485/boilers/4/state"
    current_temperature_template: "{{ value_json.value.current_temp }}"
    temperature_state_topic: "hass485/boilers/4/state"
    temperature_command_topic: "hass485/boilers/4/command"
    temperature_state_template: "{{ value_json.value.set_temp }}"
    temperature_command_template: '{"type": "set_temp", "value": {{ value }}}'
    min_temp: 10
    max_temp: 30
    temp_step: 1

# 스위치 (일괄소등) 설정
switch:
  - platform: mqtt
    name: "일괄소등"
    state_topic: "hass485/alloff/state"
    command_topic: "hass485/alloff/command"
    state_value_template: "{{ value_json.value }}"
    payload_on: '{"type": "on", "value": "ON"}'
    payload_off: '{"type": "off", "value": "OFF"}'
    optimistic: false
    retain: false

# 버튼 설정
mqtt:
  button:
    - name: "현관문 열기"
      command_topic: "hass485/door/command"
      payload_press: '{"type": "open", "value": "OPEN"}'
      retain: false

    - name: "엘리베이터 호출"
      command_topic: "hass485/elevator/command"
      payload_press: '{"type": "call", "value": "CALL"}'
      retain: false

# 바이너리 센서 (도어벨) 설정
binary_sensor:
  - platform: mqtt
    name: "도어벨"
    state_topic: "hass485/doorbell/state"
    state_value_template: "{{ value_json.value }}"
    device_class: occupancy
    payload_on: "ON"
    payload_off: "OFF" 