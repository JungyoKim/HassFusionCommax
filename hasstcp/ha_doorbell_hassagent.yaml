# HassAgent (Windows) 벨 알림 자동화
# configuration.yaml에 추가하세요

automation:
  # 1층 벨 → HassAgent 알림
  - alias: "1층 벨 알림 (HassAgent)"
    mode: single
    triggers:
      - trigger: event
        event_type: 1층_벨_event
        event_data:
          event_type: "doorbell"
    actions:
      # HassAgent 알림 (기본)
      - service: notify.hass_agent_supercomputer
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
      
      # 또는 HassAgent 전용 명령 (더 많은 기능)
      - service: hass_agent.send_notification
        target:
          device_id: 9789038b233e19f1efc9c27ace7ecbfb
        data:
          message: "1층 도어벨이 울리고 있습니다!"
          title: "집"
          duration: 10
          image: ""  # 선택사항: 이미지 URL

  # B3층 벨 → HassAgent 알림
  - alias: "B3층 벨 알림 (HassAgent)"
    mode: single
    triggers:
      - trigger: event
        event_type: b3층_벨_event
        event_data:
          event_type: "doorbell"
    actions:
      - service: hass_agent.send_notification
        target:
          device_id: 9789038b233e19f1efc9c27ace7ecbfb
        data:
          message: "B3층 도어벨이 울리고 있습니다!"
          title: "집"
          duration: 10

  # B4층 벨 → HassAgent 알림
  - alias: "B4층 벨 알림 (HassAgent)"
    mode: single
    triggers:
      - trigger: event
        event_type: b4층_벨_event
        event_data:
          event_type: "doorbell"
    actions:
      - service: hass_agent.send_notification
        target:
          device_id: 9789038b233e19f1efc9c27ace7ecbfb
        data:
          message: "B4층 도어벨이 울리고 있습니다!"
          title: "집"
          duration: 10

# HassAgent 문열기 자동화 (버튼 클릭과 동일)
automation:
  # 1층 문열기 (스크립트로 래핑)
  - alias: "1층 문열기 (HassAgent 트리거)"
    mode: single
    triggers:
      - trigger: device
        domain: hass_agent
        device_id: 9789038b233e19f1efc9c27ace7ecbfb
        type: notifications_event
        action: "OPEN_1F"  # HassAgent에서 설정한 액션명
    actions:
      - service: button.press
        data:
          entity_id: button.1층_문열기
      - service: notify.hass_agent_supercomputer
        data:
          title: "문 열림"
          message: "1층 문을 열었습니다!"

  # B3층 문열기
  - alias: "B3층 문열기 (HassAgent 트리거)"
    mode: single
    triggers:
      - trigger: device
        domain: hass_agent
        device_id: 9789038b233e19f1efc9c27ace7ecbfb
        type: notifications_event
        action: "OPEN_B3"
    actions:
      - service: button.press
        data:
          entity_id: button.b3층_문열기
      - service: notify.hass_agent_supercomputer
        data:
          title: "문 열림"
          message: "B3층 문을 열었습니다!"

  # B4층 문열기
  - alias: "B4층 문열기 (HassAgent 트리거)"
    mode: single
    triggers:
      - trigger: device
        domain: hass_agent
        device_id: 9789038b233e19f1efc9c27ace7ecbfb
        type: notifications_event
        action: "OPEN_B4"
    actions:
      - service: button.press
        data:
          entity_id: button.b4층_문열기
      - service: notify.hass_agent_supercomputer
        data:
          title: "문 열림"
          message: "B4층 문을 열었습니다!"

# 참고:
# HassAgent는 Windows PC에서 실행되며, 
# 알림에 버튼을 추가하려면 HassAgent 설정에서 
# Notification Action을 직접 설정해야 합니다.
#
# HassAgent 설정:
# 1. HassAgent 열기
# 2. Configuration → Notifications
# 3. Actions 추가:
#    - Name: "OPEN_1F", Title: "1층 문 열기"
#    - Name: "OPEN_B3", Title: "B3층 문 열기"
#    - Name: "OPEN_B4", Title: "B4층 문 열기"

