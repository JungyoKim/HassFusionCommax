# Home Assistant 벨 알림 통합 자동화 (iOS + HassAgent)
# 기존 자동화를 이것으로 교체하세요

automation:
  # 1층 벨 알림 (모든 디바이스)
  - alias: "1층 벨 알림"
    description: "1층 벨이 울리면 모든 디바이스에 알림"
    mode: single
    triggers:
      - trigger: event
        event_type: 1층_벨_event
        event_data:
          event_type: "doorbell"
    conditions: []
    actions:
      - variables:
          action_open_1f: "{{ 'OPEN_1F_' ~ context.id }}"
      
      # iOS 알림 (정윤님) - 버튼 포함
      - service: notify.mobile_app_gimjungyoyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
      
      # iOS 알림 (미현님) - 버튼 포함
      - service: notify.mobile_app_mihyunyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
      
      # iOS 알림 (민윤님) - 버튼 포함
      - service: notify.mobile_app_gimmingyoyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
      
      # HassAgent 알림 (PC - supercomputer) with 버튼
      - service: notify.supercomputer
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "OPEN_1F"
                title: "문 열기"
      
      # iOS + HassAgent 응답 대기 (1분 타임아웃)
      - wait_for_trigger:
          # iOS 버튼 클릭
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_open_1f }}"
          # HassAgent 버튼 클릭
          - platform: device
            domain: hass_agent
            device_id: 9789038b233e19f1efc9c27ace7ecbfb
            type: notifications_event
            action: "OPEN_1F"
        timeout: "00:01:00"
        continue_on_timeout: true
      
      # 버튼 클릭 시 (iOS 또는 HassAgent)
      - condition: template
        value_template: "{{ wait.trigger is not none }}"
      - service: button.press
        data:
          entity_id: button.1층_문열기
      - service: notify.mobile_app_gimjungyoyi_iphone
        data:
          title: "문 열림"
          message: "1층 문을 열었습니다!"
      - service: notify.supercomputer
        data:
          title: "문 열림"
          message: "1층 문을 열었습니다!"

