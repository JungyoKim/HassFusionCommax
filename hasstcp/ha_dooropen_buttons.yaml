# Home Assistant 층별 문열기 버튼 설정
# configuration.yaml에 추가하세요

mqtt:
  # B4층 문열기 버튼
  - platform: button
    name: "B4층 문열기"
    unique_id: "dooropen_button_b4"
    command_topic: "hasstcp/parking/door/B4/set"
    payload_press: "PRESS"
    icon: mdi:door-open
    
  # B3층 문열기 버튼
  - platform: button
    name: "B3층 문열기"
    unique_id: "dooropen_button_b3"
    command_topic: "hasstcp/parking/door/B3/set"
    payload_press: "PRESS"
    icon: mdi:door-open
    
  # 1층 문열기 버튼
  - platform: button
    name: "1층 문열기"
    unique_id: "dooropen_button_1f"
    command_topic: "hasstcp/parking/door/1F/set"
    payload_press: "PRESS"
    icon: mdi:door-open

# 사용 예시 (Lovelace 대시보드)
# type: vertical-stack
# cards:
#   - type: entities
#     title: 문열기 제어
#     entities:
#       - entity: button.b4층_문열기
#       - entity: button.b3층_문열기
#       - entity: button.1층_문열기

# 자동화 예시 (벨 울리면 자동으로 문 열기)
automation:
  # B3층 벨 울리면 자동으로 문 열기
  - alias: "B3층 벨 울림 시 자동 문열기"
    mode: single
    trigger:
      - platform: event
        event_type: b3층_벨_event
        event_data:
          event_type: "doorbell"
    action:
      # 3초 대기 (선택사항)
      - delay: 3
      # B3층 문 열기
      - service: button.press
        target:
          entity_id: button.b3층_문열기
      # 알림
      - service: notify.mobile_app
        data:
          title: "🔔 B3층 벨 → 문 자동 열림"
          message: "B3층 벨이 울려 자동으로 문을 열었습니다."

# MQTT 토픽 구조:
# 명령 (HA → hasstcp):
#   - hasstcp/parking/door/B4/set  : "PRESS" → B4층 문 열기
#   - hasstcp/parking/door/B3/set  : "PRESS" → B3층 문 열기
#   - hasstcp/parking/door/1F/set  : "PRESS" → 1층 문 열기
#
# 동작 방식:
# 1. HA에서 "B3층 문열기" 버튼 클릭
# 2. hasstcp/parking/door/B3/set 토픽에 "PRESS" 발행
# 3. hasstcp 프로그램이 메시지 수신
# 4. 10.9.1.27:29752로 SOAP setOutOfBandDoorOpen 요청 전송
# 5. 문 열림!

