# Home Assistant 벨 알림 with 문열기 버튼 (Actionable Notification)
# 기존 자동화를 이것으로 교체하세요

automation:
  # 1층 벨 알림 + 문열기 버튼
  - alias: "1층 벨 알림 (문열기 버튼)"
    description: "1층 벨이 울리면 알림과 함께 문열기 버튼 표시"
    mode: single
    triggers:
      - trigger: event
        event_type: 1층_벨_event
        event_data:
          event_type: "doorbell"
    conditions: []
    actions:
      - variables:
          action_open_1f: "{{ 'OPEN_1F_' ~ context.id }}"
      
      # 모든 가족에게 알림 전송
      - service: notify.mobile_app_gimjungyoyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
                
      - service: notify.supercomputer
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                
      - service: notify.mobile_app_mihyunyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
                
      - service: notify.mobile_app_gimmingyoyi_iphone
        data:
          title: "집"
          message: "1층 도어벨이 울리고 있습니다!"
          data:
            actions:
              - action: "{{ action_open_1f }}"
                title: "문 열기"
                icon: "sfsymbols:door.left.hand.open"
      
      # 응답 대기 (1분 타임아웃)
      - wait_for_trigger:
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_open_1f }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      
      # "문 열기" 버튼 클릭 시
      - condition: template
        value_template: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_open_1f }}"
      - service: button.press
        data:
          entity_id: button.1층_문열기
      - service: notify.mobile_app_gimjungyoyi_iphone
        data:
          title: "문 열림"
          message: "1층 문을 열었습니다!"

