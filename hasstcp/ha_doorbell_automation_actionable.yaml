# 주요 기능:
# 1. 벨 울림 → 모든 가족에게 알림
# 2. 알림에 "문 열기" 버튼 표시
# 3. Critical Alert로 더 눈에 잘 띄게 설정
# 4. "문 열기" 클릭 → 해당 층 문 자동으로 열림
# 5. 1분 내 응답 없으면 자동 종료
# 6. context.id로 고유 action ID 생성하여 중복 방지
