# Home Assistant MQTT 센서 설정 예시
# configuration.yaml에 추가하세요

mqtt:
  sensor:
    # 최근 입차 차량 번호
    - name: "주차장 최근 입차"
      state_topic: "hasstcp/parking"
      value_template: "{% if value_json.event_type == 'parkIn' %}{{ value_json.car_no }}{% else %}{{ states('sensor.parking_latest_entry') }}{% endif %}"
      icon: mdi:car-arrow-right
      
    # 최근 출차 차량 번호
    - name: "주차장 최근 출차"
      state_topic: "hasstcp/parking"
      value_template: "{% if value_json.event_type == 'parkOut' %}{{ value_json.car_no }}{% else %}{{ states('sensor.parking_latest_exit') }}{% endif %}"
      icon: mdi:car-arrow-left
      
    # 입출차 이벤트 타입
    - name: "주차장 최근 이벤트"
      state_topic: "hasstcp/parking"
      value_template: >
        {% if value_json.event_type == 'parkIn' %}입차
        {% elif value_json.event_type == 'parkOut' %}출차
        {% else %}알 수 없음{% endif %}
      icon: mdi:information-outline
      
    # 최근 이벤트 시간
    - name: "주차장 최근 이벤트 시간"
      state_topic: "hasstcp/parking"
      value_template: "{{ value_json.timestamp | as_datetime | as_local }}"
      device_class: timestamp
      icon: mdi:clock-outline

  # 바이너리 센서 (입차 감지)
  binary_sensor:
    - name: "주차장 입차 감지"
      state_topic: "hasstcp/parking"
      value_template: "{{ 'ON' if value_json.event_type == 'parkIn' else 'OFF' }}"
      device_class: motion
      off_delay: 3
      
    - name: "주차장 출차 감지"
      state_topic: "hasstcp/parking"
      value_template: "{{ 'ON' if value_json.event_type == 'parkOut' else 'OFF' }}"
      device_class: motion
      off_delay: 3

# 자동화 예시
automation:
  - alias: "차량 입차 알림"
    trigger:
      - platform: mqtt
        topic: "hasstcp/parking"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.event_type == 'parkIn' }}"
    action:
      - service: notify.mobile_app
        data:
          title: "🚗 차량 입차"
          message: "번호판: {{ trigger.payload_json.car_no }}"
          
  - alias: "차량 출차 알림"
    trigger:
      - platform: mqtt
        topic: "hasstcp/parking"
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.event_type == 'parkOut' }}"
    action:
      - service: notify.mobile_app
        data:
          title: "🚗 차량 출차"
          message: "번호판: {{ trigger.payload_json.car_no }}"

# MQTT 메시지 페이로드 예시:
# {
#   "event_type": "parkIn",
#   "car_no": "2814",
#   "timestamp": "2025-10-09T04:10:43+09:00",
#   "direction": "inbound",
#   "source": "10.9.12.11:38598",
#   "destination": "10.0.0.2:29709"
# }

