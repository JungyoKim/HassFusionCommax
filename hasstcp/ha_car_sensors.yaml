# Home Assistant 차량별 입차 이벤트 센서 설정
# configuration.yaml에 추가하세요

mqtt:
  # G80 입차 이벤트 (번호판: 2814)
  - platform: event
    name: "G80 입차"
    unique_id: "parking_event_g80_2814"
    state_topic: "hasstcp/parking/2814"
    event_types:
      - "parkIn"
    device_class: "doorbell"
    icon: mdi:car-side
    
  # SONATA 입차 이벤트 (번호판: 2993)
  - platform: event
    name: "SONATA 입차"
    unique_id: "parking_event_sonata_2993"
    state_topic: "hasstcp/parking/2993"
    event_types:
      - "parkIn"
    device_class: "doorbell"
    icon: mdi:car-side

  # 최근 이벤트 정보 (선택사항)
  - platform: sensor
    name: "주차장 최근 입차"
    state_topic: "hasstcp/parking"
    value_template: "{% if value_json.event_type == 'parkIn' %}{{ value_json.car_no }}{% else %}{{ states('sensor.주차장_최근_입차') }}{% endif %}"
    icon: mdi:car-arrow-right

# 자동화 예시
automation:
  # G80 입차 알림
  - alias: "G80 입차 알림"
    trigger:
      - platform: event
        event_type: g80_입차_event
        event_data:
          event_type: "parkIn"
    action:
      - service: notify.mobile_app
        data:
          title: "🚗 G80 입차"
          message: "G80(2814)이 입차했습니다."
          
  # SONATA 입차 알림
  - alias: "SONATA 입차 알림"
    trigger:
      - platform: event
        event_type: sonata_입차_event
        event_data:
          event_type: "parkIn"
    action:
      - service: notify.mobile_app
        data:
          title: "🚗 SONATA 입차"
          message: "SONATA(2993)이 입차했습니다."

# 입차 횟수 카운터 (선택사항)
counter:
  g80_입차_횟수:
    name: "G80 입차 횟수"
    icon: mdi:counter
    
  sonata_입차_횟수:
    name: "SONATA 입차 횟수"
    icon: mdi:counter

# 입차 카운트 자동화
automation:
  - alias: "G80 입차 카운트"
    trigger:
      - platform: event
        event_type: g80_입차_event
        event_data:
          event_type: "parkIn"
    action:
      - service: counter.increment
        target:
          entity_id: counter.g80_입차_횟수
          
  - alias: "SONATA 입차 카운트"
    trigger:
      - platform: event
        event_type: sonata_입차_event
        event_data:
          event_type: "parkIn"
    action:
      - service: counter.increment
        target:
          entity_id: counter.sonata_입차_횟수

# MQTT 토픽 구조:
# - hasstcp/parking         : 전체 이벤트 (JSON)
# - hasstcp/parking/2814    : G80 입차 이벤트 (JSON: {"event_type": "parkIn", "car_no": "2814", "timestamp": "..."})
# - hasstcp/parking/2993    : SONATA 입차 이벤트 (JSON: {"event_type": "parkIn", "car_no": "2993", "timestamp": "..."})
#
# 동작 방식:
# 1. 2814 입차 감지 → hasstcp/parking/2814에 이벤트 JSON 발행
# 2. event.g80_입차가 이벤트 트리거
# 3. 자동화에서 event_type을 감지해 알림/카운터 실행
# 4. 이벤트는 상태가 없고 순간적으로만 발생 (stateless)
