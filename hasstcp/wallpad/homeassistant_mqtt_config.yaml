mqtt:
  # =============================================================================
  # 엘리베이터 센서 (Sensors) - ev.go에서 전송
  # =============================================================================
  - sensor:
      name: "엘리베이터 1 층수"
      unique_id: "elevator_1_floor"
      state_topic: "home/elevator/1/status"
      value_template: >
        {% if value_json.is_basement == "1" %}
          {% if value_json.floor == "1" %}B3
          {% elif value_json.floor == "2" %}B4
          {% else %}B{{ value_json.floor }}
          {% endif %}
        {% else %}
          {{ value_json.floor }}
        {% endif %}
      unit_of_measurement: "층"
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 1 방향"
      unique_id: "elevator_1_direction"
      state_topic: "home/elevator/1/status"
      value_template: >
        {% if value_json.direction == "0" %}
          정지
        {% elif value_json.direction == "1" %}
          상행
        {% elif value_json.direction == "2" %}
          하행
        {% else %}
          알 수 없음
        {% endif %}
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 1 상태"
      unique_id: "elevator_1_status"
      state_topic: "home/elevator/1/status"
      value_template: >
        {% if value_json.status == "1" %}
          정상
        {% else %}
          오류
        {% endif %}
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 2 층수"
      unique_id: "elevator_2_floor"
      state_topic: "home/elevator/2/status"
      value_template: >
        {% if value_json.is_basement == "1" %}
          {% if value_json.floor == "1" %}B3
          {% elif value_json.floor == "2" %}B4
          {% else %}B{{ value_json.floor }}
          {% endif %}
        {% else %}
          {{ value_json.floor }}
        {% endif %}
      unit_of_measurement: "층"
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 2 방향"
      unique_id: "elevator_2_direction"
      state_topic: "home/elevator/2/status"
      value_template: >
        {% if value_json.direction == "0" %}
          정지
        {% elif value_json.direction == "1" %}
          상행
        {% elif value_json.direction == "2" %}
          하행
        {% else %}
          알 수 없음
        {% endif %}
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 2 상태"
      unique_id: "elevator_2_status"
      state_topic: "home/elevator/2/status"
      value_template: >
        {% if value_json.status == "1" %}
          정상
        {% else %}
          오류
        {% endif %}
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  # =============================================================================
  # 엘리베이터 호출 센서 (Sensors) - ev.go에서 전송
  # =============================================================================
  - sensor:
      name: "엘리베이터 1 상행 호출"
      unique_id: "elevator_1_call_up"
      state_topic: "home/elevator/1/status"
      value_template: "{{ value_json.call_up }}"
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 1 하행 호출"
      unique_id: "elevator_1_call_down"
      state_topic: "home/elevator/1/status"
      value_template: "{{ value_json.call_down }}"
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 2 상행 호출"
      unique_id: "elevator_2_call_up"
      state_topic: "home/elevator/2/status"
      value_template: "{{ value_json.call_up }}"
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - sensor:
      name: "엘리베이터 2 하행 호출"
      unique_id: "elevator_2_call_down"
      state_topic: "home/elevator/2/status"
      value_template: "{{ value_json.call_down }}"
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - binary_sensor:
      name: "엘리베이터 1 지하층"
      unique_id: "elevator_1_basement"
      state_topic: "home/elevator/1/status"
      value_template: "{{ 'ON' if value_json.is_basement == '1' else 'OFF' }}"
      availability_topic: "home/elevator/1/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 1"
        identifiers: ["elevator_1"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  - binary_sensor:
      name: "엘리베이터 2 지하층"
      unique_id: "elevator_2_basement"
      state_topic: "home/elevator/2/status"
      value_template: "{{ 'ON' if value_json.is_basement == '1' else 'OFF' }}"
      availability_topic: "home/elevator/2/status"
      availability_template: "{{ 'online' if value_json is defined else 'offline' }}"
      device:
        name: "엘리베이터 2"
        identifiers: ["elevator_2"]
        manufacturer: "월패드"
        model: "엘리베이터 모니터링"

  # =============================================================================
  # 조명 (Lights) - 5개 조명
  # =============================================================================
  - light:
      name: "거실 조명1"
      unique_id: "light_living_room"
      command_topic: "home/lights/1/set"
      state_topic: "home/lights/1/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  - light:
      name: "거실 조명2"
      unique_id: "light_kitchen"
      command_topic: "home/lights/2/set"
      state_topic: "home/lights/2/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  - light:
      name: "거실 조명3"
      unique_id: "light_bedroom"
      command_topic: "home/lights/3/set"
      state_topic: "home/lights/3/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  - light:
      name: "거실 조명4"
      unique_id: "light_bathroom"
      command_topic: "home/lights/4/set"
      state_topic: "home/lights/4/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  - light:
      name: "복도 조명"
      unique_id: "light_entrance"
      command_topic: "home/lights/5/set"
      state_topic: "home/lights/5/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  - light:
      name: "공부방 조명"
      unique_id: "light_study"
      command_topic: "studyroom/set"
      state_topic: "studyroom/state"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: false
      retain: false

  # =============================================================================
  # 보일러 (Climate) - 4개 방
  # =============================================================================
  - climate:
      name: "거실 보일러"
      unique_id: "climate_living_room"
      modes:
        - "off"
        - "heat"
      mode_state_topic: "home/boilers/1/mode"
      mode_command_topic: "home/boilers/1/mode/set"
      current_temperature_topic: "home/boilers/1/current_temperature"
      temperature_state_topic: "home/boilers/1/set_temperature"
      temperature_command_topic: "home/boilers/1/temperature/set"
      temperature_unit: "C"
      min_temp: 10
      max_temp: 30
      temp_step: 1
      mode_state_template: "{{ value }}"
      temperature_state_template: "{{ value }}"
      current_temperature_template: "{{ value }}"

  - climate:
      name: "안방 보일러"
      unique_id: "climate_kitchen"
      modes:
        - "off"
        - "heat"
      mode_state_topic: "home/boilers/2/mode"
      mode_command_topic: "home/boilers/2/mode/set"
      current_temperature_topic: "home/boilers/2/current_temperature"
      temperature_state_topic: "home/boilers/2/set_temperature"
      temperature_command_topic: "home/boilers/2/temperature/set"
      temperature_unit: "C"
      min_temp: 10
      max_temp: 30
      temp_step: 1
      mode_state_template: "{{ value }}"
      temperature_state_template: "{{ value }}"
      current_temperature_template: "{{ value }}"

  - climate:
      name: "공부방 보일러"
      unique_id: "climate_bedroom"
      modes:
        - "off"
        - "heat"
      mode_state_topic: "home/boilers/3/mode"
      mode_command_topic: "home/boilers/3/mode/set"
      current_temperature_topic: "home/boilers/3/current_temperature"
      temperature_state_topic: "home/boilers/3/set_temperature"
      temperature_command_topic: "home/boilers/3/temperature/set"
      temperature_unit: "C"
      min_temp: 10
      max_temp: 30
      temp_step: 1
      mode_state_template: "{{ value }}"
      temperature_state_template: "{{ value }}"
      current_temperature_template: "{{ value }}"

  - climate:
      name: "침대방 보일러"
      unique_id: "climate_bathroom"
      modes:
        - "off"
        - "heat"
      mode_state_topic: "home/boilers/4/mode"
      mode_command_topic: "home/boilers/4/mode/set"
      current_temperature_topic: "home/boilers/4/current_temperature"
      temperature_state_topic: "home/boilers/4/set_temperature"
      temperature_command_topic: "home/boilers/4/temperature/set"
      temperature_unit: "C"
      min_temp: 10
      max_temp: 30
      temp_step: 1
      mode_state_template: "{{ value }}"
      temperature_state_template: "{{ value }}"
      current_temperature_template: "{{ value }}"

  # =============================================================================
  # 엘리베이터 (Switch)
  # =============================================================================
  - button:
      name: "엘리베이터 호출"
      unique_id: "button_elevator_call"
      command_topic: "home/elevator/call/set"
      payload_press: "ON"
      retain: false

  - switch:
      name: "일괄소등"
      unique_id: "switch_all_off"
      command_topic: "home/alloff/set"
      state_topic: "home/alloff/state"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      retain: false

  # =============================================================================
  # 도어벨 (Binary Sensor)
  # =============================================================================
  - binary_sensor:
      name: "도어벨"
      unique_id: "binary_sensor_doorbell"
      state_topic: "home/doorbell/state"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: "occupancy"
      off_delay: 10 # 10초 후 자동으로 OFF

  # =============================================================================
  # 도어벨 제어 (Switch)
  # =============================================================================
  - button:
      name: "현관문 열기"
      unique_id: "button_door_open"
      command_topic: "home/doorbell/open/set"
      payload_press: "ON"
      retain: false

  # =============================================================================
  # 센서 (Sensors) - 온도 모니터링
  # =============================================================================
  - sensor:
      name: "거실 보일러 온도 센서"
      unique_id: "sensor_living_room_temp"
      state_topic: "home/boilers/1/current_temperature"
      unit_of_measurement: "°C"

  - sensor:
      name: "안방 보일러 온도 센서"
      unique_id: "sensor_kitchen_temp"
      state_topic: "home/boilers/2/current_temperature"
      unit_of_measurement: "°C"

  - sensor:
      name: "공부방 보일러 온도 센서"
      unique_id: "sensor_bedroom_temp"
      state_topic: "home/boilers/3/current_temperature"
      unit_of_measurement: "°C"

  - sensor:
      name: "침대방 보일러 온도 센서"
      unique_id: "sensor_bathroom_temp"
      state_topic: "home/boilers/4/current_temperature"
      unit_of_measurement: "°C"
