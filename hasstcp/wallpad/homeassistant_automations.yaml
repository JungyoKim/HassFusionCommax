# Home Assistant 자동화 설정
# 엘리베이터 모니터링 자동화

# =============================================================================
# 엘리베이터 1 층수 변화 알림
# =============================================================================
- alias: "엘리베이터 1 층수 변화 알림"
  description: "엘리베이터 1의 층수가 변경될 때 알림"
  trigger:
    platform: state
    entity_id: sensor.elevator_1_floor
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.elevator_1_floor
          state: unavailable
  action:
    - service: notify.mobile_app
      data:
        title: "엘리베이터 1 상태"
        message: "현재 {{ states('sensor.elevator_1_floor') }}층에 있습니다. ({{ states('sensor.elevator_1_direction') }})"

# =============================================================================
# 엘리베이터 2 층수 변화 알림
# =============================================================================
- alias: "엘리베이터 2 층수 변화 알림"
