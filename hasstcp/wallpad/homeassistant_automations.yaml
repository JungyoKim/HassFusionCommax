# =============================================================================
# 엘리베이터 1 상행 호출 감지
# =============================================================================
- alias: "엘리베이터 1 상행 호출 감지"
  description: "엘리베이터 1 상행 호출 버튼이 눌렸을 때 알림"
  trigger:
    platform: state
    entity_id: sensor.elevator_1_call_up
    to: "1"
  action:
    - service: notify.mobile_app
      data:
        title: "엘리베이터 호출"
        message: "엘리베이터 1 상행 호출이 감지되었습니다."

